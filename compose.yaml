services:
  lake-mood:
    build: .
    image: lake-mood
    container_name: lake-mood
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      TZ: ${TZ:-America/Chicago}
      NWS_UA: ${NWS_UA}
      OBS_INTERVAL: ${OBS_INTERVAL:-600}
      FC_INTERVAL: ${FC_INTERVAL:-3600}
      DB_PATH: /data/lake.db
    volumes:
      # NAS convention: persistent service data lives under
      # /volume1/docker/<service>-data on the Synology.
      - /volume1/docker/lake-mood-data:/data:rw
    mem_limit: 128m
